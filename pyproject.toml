[project]
name = "llm-xed-group9"
version = "0.1.0"
description = "Cross-lingual multi-label emotion classification on XED (English + Spanish) with prompting and QLoRA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.1.0",
    "iterative-stratification>=0.1.9",
    "matplotlib>=3.11.2",
    "peft>=0.21.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "trl>=1.16.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = [
    "BLE001",  # model_commit() may fail for any reason when offline
    "FURB122",  # a plain for loop with f.write is easier to read
]
