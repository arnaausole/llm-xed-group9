# zero-shot prompting. Second model (prompting only); gated on Hugging Face, needs an access token.
experiment: llama3.1-8b_zero-shot

model:
  name: meta-llama/Llama-3.1-8B-Instruct
  revision: 0e9e39f249a16976918f6564b8830bc894c89659  # pinned: commit used for all dev runs
  dtype: bfloat16  # use float16 on GPUs without bfloat16 support (e.g. V100)
chat_template_kwargs: {}

prompt:
  variant: v1  # v1 / v2 / v3, see prompting/prompts.py; compare only on dev
  n_shots: 0
  demos_file: null

languages: [en, es]

decoding:
  do_sample: false  # greedy, deterministic
  max_new_tokens: 64

batch_size: 16
seed: 42
