# Qwen3-8B five-shot
experiment: qwen3-8b_five-shot

model:
  name: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  dtype: bfloat16
chat_template_kwargs:
  enable_thinking: false  # no thinking

prompt:
  variant: v1  # v1 / v2 / v3, see prompting/prompts.py; compare only on dev
  n_shots: 5
  demos_file: splits/fewshot_ids.txt  # from prompting/select_demos.py --seed 42

languages: [en, es]

decoding:
  do_sample: false  # greedy
  max_new_tokens: 64

batch_size: 16
seed: 42
